name: Build VISE-8
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev
      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build VST3
        run: cmake --build build --config Release --target VISE8_VST3 -j 4
      - name: Build AU (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target VISE8_AU -j 4
      - name: Ad-hoc sign + auval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          codesign --force --deep -s - build/VISE8_artefacts/Release/VST3/VISE-8.vst3
          codesign --force --deep -s - build/VISE8_artefacts/Release/AU/VISE-8.component
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/VISE8_artefacts/Release/AU/VISE-8.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Vs08 Anvl
      - uses: actions/upload-artifact@v4
        with:
          name: VISE-8-${{ runner.os }}
          path: |
            build/VISE8_artefacts/Release/VST3/*
            build/VISE8_artefacts/Release/AU/*
